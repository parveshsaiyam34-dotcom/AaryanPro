- name: Extract ZIP
  run: |
    mkdir extracted
    ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)

    if [ -z "$ZIP_FILE" ]; then
      echo "ERROR: ZIP file not found!"
      ls -la
      exit 1
    fi

    echo "Using ZIP: $ZIP_FILE"
    unzip -q "$ZIP_FILE" -d extracted

    PROJECT_DIR=$(dirname "$(find extracted -name package.json -print -quit)")

    if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
      echo "ERROR: package.json not found!"
      find extracted -maxdepth 4 -type f | head -100
      exit 1
    fi

    echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
    echo "Project found at: $PROJECT_DIR"
